version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pharma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-pharma_manager_db}
      POSTGRES_USER:     ${DB_USER:-pharma_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharma_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharma_user} -d ${DB_NAME:-pharma_manager_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Django Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./pharma_backend
      dockerfile: Dockerfile
    container_name: pharma_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY:           ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG:                ${DEBUG:-True}
      ALLOWED_HOSTS:        ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DB_NAME:              ${DB_NAME:-pharma_manager_db}
      DB_USER:              ${DB_USER:-pharma_user}
      DB_PASSWORD:          ${DB_PASSWORD:-pharma_pass}
      DB_HOST:              db
      DB_PORT:              5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/schema/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── React Frontend (nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./pharma_frontend
      dockerfile: Dockerfile
    container_name: pharma_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
